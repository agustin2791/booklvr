services:
  api:
    image: ahgoose/booklvrapi:0.1
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file: api.env

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    env_file:
      - api.env
